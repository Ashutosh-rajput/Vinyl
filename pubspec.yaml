name: vinyl
description: Privacy-first music player built with Flutter

publish_to: 'none'

version: 2.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & BLoC
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  rxdart: ^0.28.0

  # Service Locator & DI
  get_it: ^9.2.1

  # Database
  drift: ^2.18.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: 0.5.24

  # Audio Playback
  just_audio: ^0.10.6
  audio_session: ^0.2.4

  # File & Storage
  permission_handler: ^12.0.3
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  on_audio_query: ^2.9.0

  # Network & Downloading
  dio: ^5.7.0
  youtube_explode_dart: ^3.1.0
  receive_sharing_intent: ^1.8.0

  # Image Loading & Caching
  cached_network_image: ^3.3.1

  # UI & Material Design
  material_color_utilities: ^0.13.0
  google_fonts: ^8.2.0
  flutter_svg: ^2.0.10

  # Settings & Preferences
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.20.3
  logger: ^2.2.0
  just_audio_background: ^0.0.1-beta.17
  flutter_local_notifications: ^22.2.0
  flutter_background_service: ^5.1.0
  fluttertoast: ^9.1.0
  dart_des: ^1.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/google_fonts/

dependency_overrides:
  path_provider_android: 2.2.5
  sqlite3_flutter_libs: 0.5.24
